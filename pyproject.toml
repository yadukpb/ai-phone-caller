[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-phone-caller"
version = "0.1.0"
description = "Control plane for self-hosted AI outbound phone calls"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "livekit-agents[openai]~=1.8",
  "livekit-api>=1.2,<2",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
tts = [
  "qwen-tts>=0.1.1",
  "soundfile>=0.12",
  "torch>=2.4",
]
